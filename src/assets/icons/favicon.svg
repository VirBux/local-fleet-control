<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Local Fleet Control">
  <title>Local Fleet Control</title>
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="256" y1="0" x2="256" y2="512">
      <stop offset="0" stop-color="#1d2b25"/>
