<header class="app-header">
  <!-- Produktname: bleibt in jeder Sprache stehen (REQUIREMENTS §6, Markenklausel). -->
  <h1>Local Fleet Control</h1>

  <!-- Sprachwahl. Vorläufig im Kopf der App: Die Einstellungsansicht aus
       REQUIREMENTS §4.5 gibt es noch nicht, umschaltbar sein muss die Sprache aber
       jetzt schon. -->
  <label class="language-select">
    <span class="visually-hidden">{{ t('language.label') }}</span>
    <select [value]="language()" (change)="selectLanguage($any($event.target).value)">
      @for (option of languages; track option) {
        <option [value]="option">{{ languageNames[option] }}</option>
      }
    </select>
  </label>
</header>

<!-- Zwei Seiten, weil es zwei Situationen gibt: einrichten (suchen, zuordnen) und
     Notfall (schalten). Siehe docs/plans/projekt-geraete.md. -->
<nav class="tabs" role="tablist">
  <button
    type="button"
    role="tab"
    class="tab"
    [class.active]="tab() === 'discovery'"
    [attr.aria-selected]="tab() === 'discovery'"
    (click)="selectTab('discovery')"
  >
    {{ t('tab.discovery') }}
  </button>
  <button
    type="button"
    role="tab"
    class="tab"
    [class.active]="tab() === 'project'"
    [attr.aria-selected]="tab() === 'project'"
    (click)="selectTab('project')"
  >
    {{ t('tab.project') }}
  </button>
</nav>

<!-- Beide Seiten bleiben im DOM und werden nur aus- und eingeblendet, statt sie mit `@if`
     zu erzeugen und wegzuwerfen: Sonst wäre nach einem Blick ins Projekt das Scan-Ergebnis
     verloren und der Scan müsste von vorn beginnen. -->
<main class="app-main">
  <div class="page" role="tabpanel" [hidden]="tab() !== 'discovery'">
    <app-discovery-page />
  </div>
  <div class="page" role="tabpanel" [hidden]="tab() !== 'project'">
    <app-project-page />
  </div>
</main>

<footer class="app-footer">
  <!-- Markenzeile: bleibt unübersetzt (REQUIREMENTS §1). -->
  <a href="https://ha-fleet-manager.com" (click)="openHomepage($event)">
    powered by HA Fleet Manager
  </a>
  @if (version()) {
    <span class="version">v{{ version() }}</span>
  }
</footer>
